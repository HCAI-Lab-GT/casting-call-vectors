# Checkpoint manifest for persona trajectory experiments.
# Token counts are taken from the paper appendix and tables.
# Verify branch/revision names with Hugging Face before running.

olmo3_7b:
  model_id: allenai/Olmo-3-1025-7B
  same_checkpoint_smoke_default:
    - revision: stage1-step5000
      tokens: 21.0B
      stage: pretraining
    - revision: main
      tokens: 6.08T
      stage: final_base_or_midtraining_endpoint
  paper_grid:
    - {revision: stage1-step1000, tokens: 4.19B, note: early; often incoherent/no persona in paper}
    - {revision: stage1-step2000, tokens: 8.39B, note: early; often incoherent/no persona in paper}
    - {revision: stage1-step3000, tokens: 12.6B}
    - {revision: stage1-step5000, tokens: 21.0B}
    - {revision: stage1-step7000, tokens: 29.4B}
    - {revision: stage1-step9000, tokens: 37.7B}
    - {revision: stage1-step10000, tokens: 41.9B}
    - {revision: stage1-step15000, tokens: 62.9B}
    - {revision: stage1-step20000, tokens: 83.9B}
    - {revision: stage1-step30000, tokens: 126B}
    - {revision: stage1-step50000, tokens: 210B}
    - {revision: stage1-step99000, tokens: 415B}
    - {revision: stage1-step297000, tokens: 1.25T}
    - {revision: stage1-step707000, tokens: 2.97T}
    - {revision: stage1-step1413814, tokens: 5.93T}
    - {revision: stage2-step47684, tokens: 6.03T, stage: midtraining}
    - {revision: main, tokens: 6.08T, stage: final_base_or_main}
  post_training_targets:
    - {model_id: allenai/Olmo-3-7B-Instruct-SFT, stage: SFT}
    - {model_id: allenai/Olmo-3-7B-Instruct-DPO, stage: DPO}
    - {model_id: allenai/Olmo-3-7B-Instruct, stage: final_RLVR_or_Instruct}
  paper_hyperparameters:
    emergence:
      evil: {layer: 16, coefficient: 0.5}
      sycophantic: {layer: 16, coefficient: 0.5}
      impolite: {layer: 16, coefficient: 0.5}
      humorous: {layer: 20, coefficient: 0.3}
    transfer_to_instruct:
      evil: {layer: 16, coefficient: 0.55}
      sycophantic: {layer: 16, coefficient: 0.5}
      impolite: {layer: 20, coefficient: 0.75}
      humorous: {layer: 20, coefficient: 0.3}

