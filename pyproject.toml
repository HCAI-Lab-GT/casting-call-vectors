[project]
name = "persona-vectors-evals"
version = "0.1.0"
description = "Persona dataset generation and Inspect AI evals (HF/vLLM ready)."
authors = [{ name = "EILab", email = "dev@eilab.example" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers>=4.44.0",
  "torch>=2.3.0",
  "openai>=1.53.0",
  "tqdm>=4.66.0",
  "datasets>=3.1.0",
  "accelerate>=1.0.0",
  "bitsandbytes>=0.48.0",
  "inspect-ai>=0.3.4",
  "anthropic>=0.75.0",
  "python-dotenv>=1.0.0",
  "wandb>=0.18.7",
  "vllm>=0.5.2",
  "matplotlib>=3.9.0",
  "nvitop>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["persona_vectors_evals"]

[tool.ruff]
line-length = 100
extend-select = ["B", "I", "C4", "RET"]
